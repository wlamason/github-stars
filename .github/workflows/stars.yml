name: stars

# No push trigger. This job checks out and pushes with the STARS_DEPLOY_KEY
# deploy key so it can write stars.md to main despite the ruleset that
# requires a pull request. Deploy-key pushes start workflows (a GITHUB_TOKEN
# push does not) and are attributed to the key owner, so a push trigger runs
# this job again on its own commit. The daily schedule is the update.
# workflow_dispatch is the manual refresh.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.STARS_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.15"
      - name: install dependencies
        run: uv sync --locked --no-dev
      - name: generate stars.md
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: uv run --locked --no-dev python github_stars.py -v --json wlamason
      - name: git push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.md
          # [skip ci]: a deploy-key push starts workflows, so skip them.
          git commit -m "$(date +%F) stars workflow run [skip ci]"
          git push
