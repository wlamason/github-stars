name: ci

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.9"
      - name: install dependencies
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check
      - name: ruff check
        run: uv run ruff check

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.9"
      - name: install dependencies
        run: uv sync --locked
      - name: pytest
        run: uv run pytest
